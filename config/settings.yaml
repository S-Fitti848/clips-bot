# Parámetros de la corrida. Cambiar acá, no en el código.

candidatos:
  ventana_horas: 168         # 7 días: clips creados en las últimas N horas
  antiguedad_min_h: 24       # un clip entra recién cuando juntó vistas y duplicados.
                             # Los más nuevos NO se marcan en la DB: vuelven a entrar cuando maduran.
  idioma: es                 # campo `language` del clip en Twitch (ISO 639-1)
  duracion_min_s: 15
  duracion_max_s: 60       # los clips de Twitch salen de 60 s; el render corta a 59
  min_vistas: 0              # recientes: no se filtra por vistas (el score ya las pondera)
  n_candidatos: 8            # cuántos pasan a descarga (§3 paso 3)
  max_clips_por_streamer: 100
  # §4 capa 1 del filtro de música: categorías que se descartan directo.
  categorias_excluidas:
    - Music
    - DJs
  # Co-streams y eventos (contenido de terceros, Content ID casi seguro). Se busca en el título del
  # clip y en el título del stream (VOD). Sin distinguir mayúsculas ni tildes; palabra completa.
  # Falsos positivos aceptados. Motivo en la DB: "costream".
  palabras_costream:
    - LEC
    - LCK
    - LCS
    - Worlds
    - MSI
    - co-stream
    - costream
    - Kings League
    - Velada
  # Palabras de fútbol: SOLO se aplican a streamers con detectar_marcador: true (los que transmiten
  # partidos). Medido 2026-09-22: aplicadas a todos, "final" tiraba clips de juego perfectamente
  # sanos ("Final de Geoware World", "cinemática del boss final") y "partido"/"gol" son comunes en
  # cualquier stream. En los 52 canales del Dedsafío eran 6 falsos positivos de 12 descartes.
  palabras_deportes:
    - gol
    - resumen
    - Boca
    - River
    - selección
    - Mundial
    - partido
    - final
  # Categorías de Twitch donde se transmiten eventos/deportes oficiales. Juegos como
  # League of Legends NO van acá (se juegan normal); para eso están las palabras.
  categorias_costream:
    - Sports
    - Special Events
  # Clips del mismo streamer y mismo VOD con vod_offset a ±N s del más visto = mismo momento.
  # Queda uno solo (el más visto que pase los filtros); cuántos hubo suma puntaje (seleccion.peso_momento).
  ventana_momento_s: 60

# Grupo "evento" (streamers cargados en una sección evento_* de streamers.yaml). Son decenas de
# canales transmitiendo lo mismo: solo entran clips de esas categorías o con esas palabras en el
# título, y dentro del período del evento. Además, los clips de distintos streamers hechos a la
# misma hora real (±ventana) cuentan como el MISMO momento: si 5 canales clipearon la misma muerte,
# ese momento sube mucho de score.
evento:
  categorias:
    - Minecraft
  palabras:
    - dedsafio
    - nights
  desde: ""                  # AAAA-MM-DD, primer día del evento (vacío = sin piso)
  hasta: ""                  # AAAA-MM-DD (vacío = sin techo)
  ventana_entre_streamers_s: 120

# Kick (API interna de la web). sort=view + time=week trae los MÁS VISTOS de la semana; sin eso
# vienen los últimos subidos, que en un canal grande son cientos de clips de la última hora con 2 o
# 3 vistas (medido en davooxeneize el 2026-09-22).
kick:
  orden: view
  ventana: week              # day | week | month | "" (todos)
  max_clips: 60
  pausa_s: 1.0               # entre llamadas: son 8 canales y la API interna no documenta su límite

# Fuente "catalogo": clips viejos del streamer, por vistas absolutas. Usa los mismos filtros de
# duración, idioma, música y co-stream que `candidatos`, con su propio mínimo de vistas.
# Cursor de Helix por streamer en la DB: cada corrida sigue donde quedó la anterior; al agotarse,
# arranca un ciclo nuevo con la ventana de fechas actualizada.
catalogo:
  antiguedad_min_dias: 7
  antiguedad_max_dias: 1095  # 3 años
  min_vistas: 500
  n_candidatos: 4            # cuántos pasan a descarga por corrida
  por_pagina: 20
  max_paginas: 3             # por streamer y por corrida

# §3 paso 5: layout 9:16.
render:
  ancho: 1080
  alto: 1920
  fps: 30
  duracion_max_s: 59
  alto_camara: 768           # layout split: cámara arriba 40 % (1080x768), juego abajo 60 % (1080x1152)
  separador_px: 6            # línea negra entre cámara y juego (0 = sin línea)
  recorte_inferior_camara_px: 50  # px del video original que se sacan del pie del cuadro de cámara (UI del juego)
  zoom_sin_camara: 1.08      # (ya no se usa: el recorte sin cara pasó a ser fit_blur)
  blur_sigma: 30             # fondo borroso del layout fit_blur
  # veryfast, medido en la Pi el 2026-09-23 sobre un clip de 60 s: 111 s contra 197 s de `medium`
  # (43 % menos) con SSIM 0,994 entre los dos, o sea indistinguible, y encima el archivo sale más
  # chico (2609 contra 2928 kbps). `superfast` baja a 96 s pero se va a 4738 kbps, casi el tope de
  # 5 Mbps: un clip de 59 s quedaría en ~35 MB, demasiado cerca del límite de 50 MB de Telegram.
  # En la Pi el render es la etapa más cara del pipeline, no Whisper: 107-197 s por clip con medium.
  x264_preset: veryfast
  crf: 20
  maxrate_kbps: 5000         # tope: 59 s × 5 Mbps ≈ 38 MB < 50 MB (límite de la Bot API de Telegram)

# Detección de cámara (OpenCV, caras en frames muestreados).
camara:
  frames_muestra: 20
  min_presencia: 0.4         # fracción de frames con una cara en el mismo lugar → hay cámara
  cara_grande: 0.12          # ancho de cara / ancho de frame ≥ esto → cámara a pantalla completa
  margen_borde: 0.15         # si la cara queda a menos de esto de un borde del recorte → fit_blur
  # El split da por sentado que abajo hay un juego. Con contenido multicámara (podcast, llamada,
  # estudio con dos personas) no lo hay: el panel de abajo repite la escena y corta a alguien.
  # Si en la zona del "juego" hay caras en más de presencia_juego_max de los frames → fit_blur.
  # Calibrado 2026-09-23 sobre 11 clips que daban split: los dos podcasts de coker miden 25 % y 30 %,
  # y el resto no pasa de 10 %. El mínimo de ancho hace falta porque Haar ve caras en los skins de
  # Minecraft (4,8-6,2 % del ancho) y en la gente de una transmisión; las personas filmadas miden
  # 6,7-8,8 %. Solo con la presencia no había margen (25 % contra 20 %).
  presencia_juego_max: 0.20
  cara_juego_min: 0.065

# §3 paso 6: subtítulos.
subtitulos:
  modelo: small
  # Tope de tiempo por clip: max(timeout_min_s, timeout_factor x duración). Medido en la Pi el
  # 2026-09-23: los clips normales transcriben a 0,7-1,5x la duración, pero uno de 17 s se fue a
  # 483 s (28x) porque el audio son gritos sin habla clara y el decoder entra en loop. Probado con
  # beam_size=1 y condition_on_previous_text=False, solos y juntos: 27-37x en los cuatro casos.
  # Esos clips no sirven igual (sale "no no no no"), así que se cortan y se descartan.
  timeout_factor: 8.0
  timeout_min_s: 60
  compute_type: int8
  cpu_threads: 0             # 0 = automático
  idioma: es
  fuente: Arial
  tamano: 64
  mayusculas: false
  max_chars_linea: 24
  max_lineas: 2
  max_duracion_s: 3.0        # un subtítulo no dura más que esto
  posicion_y: 0.80           # centro del bloque de subtítulos (fracción del alto). El 15 % de abajo
                             # lo tapan los botones de Shorts/TikTok: no bajar de ~0.78 con 2 líneas.

# §3 paso 4 / §4: filtros de audio (capas silencio y densidad de palabras; librosa pendiente).
filtro_audio:
  max_silencio: 0.8          # fracción del clip en silencio → descartar
  min_palabras_por_s: 0.7    # menos → probable música o gameplay puro → descartar
  silencio_db: -35
  silencio_min_s: 0.5

# Marcador de transmisión deportiva (solo streamers con detectar_marcador: true, ej. davooxeneize).
# Heurística: región de una esquina de arriba que casi no cambia mientras el resto del video sí, y
# con mucho borde (texto y líneas del gráfico). Falsos positivos posibles con HUDs de juegos.
# Dos señales: (1) marcador de TV en una esquina de arriba, (2) fracción de verde-césped (una cancha
# llena la pantalla de verde uniforme). Alcanza con que dispare una. La 2 cubre el caso real que la 1
# no vio: cámara sobre la tribuna, sin gráfico en pantalla.
# Calibrado 2026-09-22 con clips reales: el de fútbol de Davoo muestra la cancha en 2 de 12 frames
# (70 % y 68 %) y el resto es la tribuna (0 %); los de Minecraft nunca pasan de 22 %. De ahí el
# umbral de 45 % y el mínimo de 2 frames.
marcador:
  frames_muestra: 12
  quietud_min: 0.75
  bordes_min: 0.05
  cesped_min: 0.45           # 45 % del frame en verde-césped = probable cancha
  cesped_frames_min: 2       # y que pase en al menos 2 de los frames muestreados

# §3 paso 7b: Short multi-POV (el mismo momento visto por varios streamers, uno atrás del otro).
# Cada ángulo tiene que MOSTRAR algo en su tramo: si el panel es casi todo negro, ese ángulo se
# rehace con fit_blur (el 16:9 entero) y, si tampoco alcanza, se reemplaza por otro ángulo del
# mismo momento. Si no quedan min_angulos, no se arma el multi-POV.
# Calibrado 2026-09-23: el tramo de PattyMeza daba 56 % de frames vacíos; de los 13 clips split
# ya renderizados, 11 dan 0 % y los dos peores 22 % y 11 % (un corte a negro puntual).
multipov:
  margen_s: 4.0
  max_angulos: 3
  min_angulos: 3
  frames_muestra: 10
  frames_vacios_max: 0.34
  luma_negro: 0.08
  pixeles_negros_min: 0.90

# Datos personales en pantalla (OCR con tesseract, sin LLM). Ver clips_bot/pantalla.py.
# Existe porque el 2026-09-23 casi se publica un clip cuya categoría decía Minecraft pero que era
# el navegador del streamer en un checkout, con nombre, mail y dirección de un tercero.
# Falsos positivos aceptados: tirar un clip bueno sale mucho más barato que publicar eso.
# Si tesseract no está instalado, la capa se saltea con un warning y la corrida sigue.
pantalla:
  activo: true
  frames_muestra: 8
  # spa+eng: medido 2026-09-23 sobre 3 clips, spa+eng con el modelo estándar encuentra en el
  # checkout un teléfono que eng solo no leía, sin sumar falsos positivos. Cuesta ~1,5-2x el tiempo
  # (5,5 s → 10,6 s en el peor clip). El modelo va aparte del binario:
  #   Windows: spa.traineddata de github.com/tesseract-ocr/tessdata en la carpeta tessdata
  #   Pi/Debian: sudo apt install tesseract-ocr-spa
  # Si `spa` no está instalado, tesseract falla y la capa se saltea sola: poné `eng` y listo.
  idioma: spa+eng
  buscar_telefonos: true     # 9+ dígitos seguidos; apagalo si tira falsos positivos con HUDs
  # Los números (teléfono, tarjeta) solo cuentan si en el mismo frame hay una de estas palabras.
  # Medido 2026-09-23 sobre 26 clips: el regex de teléfono solo daba 3 falsos positivos (el contador
  # de dinero de Vegetta, un id de Minecraft, un timer) y ningún acierto.
  palabras_contexto:
    - tel
    - telefono
    - phone
    - celular
    - movil
    - whatsapp
    - contacto
    - contact
    - dni
    - documento
  palabras_pago:
    - checkout
    - carrito
    - subtotal
    - tarjeta
    - CVV
    - CVC
    - vencimiento
    - credit card
    - card number
    - payment
    - pagar ahora
    - paypal
    - mercadopago
    - cupon
    - discount code
  palabras_direccion:
    - direccion de envio
    - shipping
    - ship to
    - codigo postal
    - zip code
    - calle
    - avenida
    - piso
    - departamento
    - billing

# §3 paso 7: textos con Gemini.
textos:
  # El free tier de los Flash está en ~20 requests/día (reseteo a medianoche del Pacífico). Con 3
  # clips/día y UNA llamada por clip (título + descripción + hashtags + depende_de_fecha juntos)
  # entramos cómodos; lo que quema la cuota son los reintentos y las pruebas.
  modelo: gemini-3.6-flash      # 2.5-flash dio 404 para cuentas nuevas (2026-09-21)
  modelo_fallback: gemini-3.5-flash-lite   # si el principal responde 429 por cuota, sigue con este
  max_titulo: 59             # < 60 caracteres
  min_hashtags: 3
  max_hashtags: 5
  max_descripcion: 800
  reintentos: 2              # si la respuesta no valida, se reintenta con los errores (cuida la cuota)

# §3 paso 8: selección de los mejores.
# Cada fuente compite solo dentro de su cupo; los cupos que sobran pasan a la otra fuente.
#   reciente: score = (1 + peso_momento × (clips del mismo momento − 1)) × (1 + log10(1 + vistas))
#             Un clip con 0 vistas y 3 personas que lo clipearon (2,0) compite con uno de 500 vistas
#             sin duplicados (3,7); las vistas bajas no anulan el resto.
#   catalogo: score = vistas absolutas
seleccion:
  # Cupos por GRUPO (el grupo de cada streamer sale de streamers.yaml; default <plataforma>_<fuente>).
  # Lo que un grupo no llena pasa al grupo "catalogo".
  mezcla:
    argentinos: 2            # los 8 de Kick (Davoo, Spreen, La Cobra, Coker, Goncho, Brunenger, Mernuel, Coscu)
    evento: 1                # Dedsafío
    # "catalogo" (Vegetta) no tiene cupo propio: es el fallback y se queda con lo que los otros no llenen
  peso_momento: 0.5          # 3 clips del mismo momento → × 2
  max_por_streamer: 1        # un solo clip por streamer en todo el envío del día
  # Scores a menos de este % en el corte de una fuente → desempata Gemini. Por fuente, porque el
  # score reciente es logarítmico (3 % ≈ 20 % en vistas) y el de catálogo son vistas directas.
  empate_pct:
    reciente: 0.03
    catalogo: 0.10

# §3 paso 10: entrega por Telegram.
publicacion:
  horarios: ["13:00", "18:00", "21:30"]   # hora AR sugerida para cada seleccionado, en orden

# §3 paso 9. Queda en false hasta que la auditoría de la YouTube Data API esté aprobada
# (sin auditoría los uploads quedan bloqueados privados para siempre).
youtube_upload_enabled: false
