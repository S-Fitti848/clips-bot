# Streamers de los que se toman clips.
#
# PERMISO (uno de los dos):
#   cita + fuente        el streamer permite clips públicamente (Acerca de, panel de reglas o bio)
#   experimento: true    entra igual, como experimento (política 2026-09-22). Se sube en PRIVADO y
#                        recién se hace público si los Chequeos de copyright de Studio salen limpios.
# Sin ninguno de los dos, el bot lo ignora.
# Si un video recibe un reclamo o strike (/reclamo en Telegram), el streamer queda EXCLUIDO
# automáticamente en la DB (tabla streamer_estado) y no se vuelve a usar hasta sacarlo a mano.
#
# Campos:
#   login       el de la URL: twitch.tv/<login> o kick.com/<login>
#   plataforma  twitch | kick
#   fuentes     [reciente], [catalogo] o las dos
#   grupo       cupo en el que compite (seleccion.mezcla). Default: <plataforma>_<fuente>
#   subtitulos_propios  true si ya muestra subtítulos quemados en el stream
#   detectar_marcador   true para descartar clips con marcador de transmisión deportiva en pantalla

streamers:
  - login: davooxeneize
    plataforma: kick
    fuentes: [reciente]
    grupo: kick_reciente
    detectar_marcador: true    # transmite fútbol: no queremos clips con la señal en pantalla
    permiso:
      experimento: true

  - login: vegetta777
    plataforma: twitch
    fuentes: [catalogo]        # solo catálogo: sus clips recientes tienen muy pocas vistas
    grupo: catalogo
    permiso:
      experimento: true

